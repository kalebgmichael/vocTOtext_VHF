volumes:
  voctotxt_local_postgres_data: {}
  voctotxt_local_postgres_data_backups: {}
  voctotxt_local_redis_data: {}
  voctotxt_local_huggingface_cache: {}

services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: voctotxt_local_django
    container_name: voctotxt_local_django
    depends_on:
      - postgres
      - redis
      - mailpit
    volumes:
      - /app/.venv
      - .:/app:z
      - voctotxt_local_huggingface_cache:/root/.cache/huggingface
    env_file:
      - ./.envs/.local/.django
      - ./.envs/.local/.postgres
    ports:
      - '8089:8000'
      - '5005:5005/udp'
    command: /start
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: voctotxt_production_postgres
    container_name: voctotxt_local_postgres
    volumes:
      - voctotxt_local_postgres_data:/var/lib/postgresql/18/docker
      - voctotxt_local_postgres_data_backups:/backups
    env_file:
      - ./.envs/.local/.postgres

  mailpit:
    image: docker.io/axllent/mailpit:latest
    container_name: voctotxt_local_mailpit
    ports:
      - "8025:8025"

  redis:
    image: docker.io/redis:7.2
    container_name: voctotxt_local_redis
    volumes:
      - voctotxt_local_redis_data:/data

  celeryworker:
    <<: *django
    image: voctotxt_local_celeryworker
    container_name: voctotxt_local_celeryworker
    depends_on:
      - redis
      - postgres
      - mailpit
    ports: []
    command: /start-celeryworker

  celerybeat:
    <<: *django
    image: voctotxt_local_celerybeat
    container_name: voctotxt_local_celerybeat
    depends_on:
      - redis
      - postgres
      - mailpit
    ports: []
    command: /start-celerybeat

  flower:
    <<: *django
    image: voctotxt_local_flower
    container_name: voctotxt_local_flower
    ports:
      - '5555:5555'
    command: /start-flower

  node:
    build:
      context: .
      dockerfile: ./compose/local/node/Dockerfile
    image: voctotxt_local_node
    container_name: voctotxt_local_node
    depends_on:
      - django
    volumes:
      - .:/app:z
      # http://jdlm.info/articles/2016/03/06/lessons-building-node-app-docker.html
      - /app/node_modules
    command: npm run dev
    ports:
      - '3089:3089'

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: voctotxt_frontend
    container_name: voctotxt_frontend
    depends_on:
      - django
    ports:
      - '5173:5173'

